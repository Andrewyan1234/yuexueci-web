<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#123f3a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="粤学词" />
    <meta
      name="description"
      content="粤学词 - 广州小学广州版与初中沪教牛津版英语单词音标跟读与记忆小程序"
    />
    <title>粤学词 · 广州中小学英语</title>
    <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <div class="app-shell">
      <header class="topbar" id="topbar"></header>
      <main class="app-main" id="app" aria-live="polite"></main>
      <nav class="tabbar" aria-label="主导航">
        <button class="tab-item is-active" data-tab="home" type="button">
          <i data-lucide="house"></i>
          <span>今日</span>
        </button>
        <button class="tab-item" data-tab="library" type="button">
          <i data-lucide="library-big"></i>
          <span>词库</span>
        </button>
        <button class="tab-item" data-tab="speaking" type="button">
          <i data-lucide="audio-lines"></i>
          <span>跟读</span>
        </button>
        <button class="tab-item" data-tab="practice" type="button">
          <i data-lucide="dumbbell"></i>
          <span>练习</span>
        </button>
        <button class="tab-item" data-tab="profile" type="button">
          <i data-lucide="chart-no-axes-column-increasing"></i>
          <span>我的</span>
        </button>
      </nav>
    </div>

    <section class="word-sheet" id="wordSheet" aria-hidden="true"></section>
    <div class="sheet-scrim" id="sheetScrim" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="assets/lucide.min.js"></script>
    <script src="data.js?v=4"></script>
    <script src="full-data.js?v=4"></script>
    <script src="primary-data.js?v=4"></script>
    <script src="app.js"></script>
  </body>
</html>
